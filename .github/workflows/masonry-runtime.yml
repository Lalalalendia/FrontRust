name: Masonry RenderRoot WASM browser runtime
on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'experiments/masonry-wasm-probe/**'
      - 'tests/masonry-*.mjs'
      - '.github/workflows/masonry-runtime.yml'
  pull_request:
    paths:
      - 'experiments/masonry-wasm-probe/**'
      - 'tests/masonry-*.mjs'
      - '.github/workflows/masonry-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-renderroot:
    name: RenderRoot native + real wasm32 + browser Canvas2D
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser E2E harness syntax preflight
        run: node --check tests/masonry-browser-real-wasm.mjs && node --check tests/masonry-runtime-abi.mjs && node --check experiments/masonry-wasm-probe/demo/host.js
      - name: Install headless native fontconfig
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev libfreetype6-dev pkg-config
      - name: Verify licensed OpenType fixture integrity
        run: python3 tests/verify-masonry-font-fixtures.py
      - name: Native RenderRoot smoke with actual Masonry scene
        run: cargo test --features widgets --manifest-path experiments/masonry-wasm-probe/Cargo.toml
      - name: Build actual Masonry browser WASM module
        run: cargo build --release --target wasm32-unknown-unknown --features widgets --manifest-path experiments/masonry-wasm-probe/Cargo.toml
      - name: Install matching wasm-bindgen CLI
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          wasm-bindgen --version
      - name: Generate wasm-bindgen browser and Node glue
        run: |
          wasm-bindgen --target web --out-name masonry_probe \
            --out-dir experiments/masonry-wasm-probe/demo/gen \
            experiments/masonry-wasm-probe/target/wasm32-unknown-unknown/release/frontrust_masonry_wasm_probe.wasm
          test -s experiments/masonry-wasm-probe/demo/gen/masonry_probe.js
          test -s experiments/masonry-wasm-probe/demo/gen/masonry_probe_bg.wasm
      - name: Execute real wasm32 RenderRoot + event ABI with Node
        run: node tests/masonry-runtime-abi.mjs
      - name: Install Chromium/Firefox browser test environment
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium firefox
      - name: Live Rust Masonry scene to Canvas2D in Chromium and Firefox
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8792 --bind 127.0.0.1 --directory experiments/masonry-wasm-probe/demo > /tmp/masonry-browser-host.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tests/masonry-browser-real-wasm.mjs
      - name: Print demo server diagnostics on failure
        if: failure()
        run: cat /tmp/masonry-browser-host.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masonry-browser-evidence
          path: test-results/masonry-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masonry-real-wasm
          path: |
            experiments/masonry-wasm-probe/target/wasm32-unknown-unknown/release/frontrust_masonry_wasm_probe.wasm
            experiments/masonry-wasm-probe/demo/gen/masonry_probe.js
            experiments/masonry-wasm-probe/demo/gen/masonry_probe_bg.wasm
          if-no-files-found: ignore
